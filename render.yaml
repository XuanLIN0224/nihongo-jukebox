services:
  - type: web
    name: nihongo-jukebox-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nihongo_jukebox
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: CORS_ORIGIN
        value: https://xuanlin0224.github.io,http://localhost:5173
